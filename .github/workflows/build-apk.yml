name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Build Web Production Assets
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd client
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload EduTrack Native APK
        uses: actions/upload-artifact@v4
        with:
          name: EduTrack-Android-App
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
